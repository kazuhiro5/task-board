<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>task-board</title>
  <meta name="theme-color" content="#1A7F37">
  <script>
    // ちらつき防止：CSSより前に、保存した明るさ（<html data-theme>。なし＝端末に合わせる）と、左の一覧をたたんだか（.side-mini）を付ける
    try { var t = localStorage.getItem('tb.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); if (localStorage.getItem('tb.side') === 'mini') document.documentElement.classList.add('side-mini'); } catch (e) {}
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="task-board">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/add.css">
  <link rel="stylesheet" href="./css/views.css">
  <link rel="stylesheet" href="./css/edit.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <p id="loading" class="loading">読み込み中…</p>

  <section id="login" class="login" hidden>
    <h1>task-board</h1>
    <p>この端末で初めて開く時だけ、Googleでログインします。</p>
    <button id="signInBtn" type="button" class="primary">Googleでログイン</button>
    <p id="loginError" class="error" role="alert"></p>
  </section>

  <div id="appRoot" class="shell" hidden>
    <aside id="side" class="side" aria-label="画面と分類"></aside>
    <div class="main">
      <header class="top">
        <h1 id="topTitle" class="top-title"></h1>
        <button id="undoBtn" class="top-btn" type="button" aria-label="元に戻す（Ctrl+Z）" title="元に戻す（Ctrl+Z）"></button>
        <button id="redoBtn" class="top-btn" type="button" aria-label="やり直す（Ctrl+Shift+Z）" title="やり直す（Ctrl+Shift+Z・Ctrl+Y）"></button>
        <button id="searchBtn" class="top-btn" type="button" aria-label="検索（/）" title="検索（/）"></button>
        <details class="user">
          <summary aria-label="メニュー">⋯</summary>
          <div class="user-menu">
            <span id="userBox"></span>
            <fieldset class="theme-pick">
              <legend>明るさ</legend>
              <div id="themeOpts" class="theme-opts"></div>
            </fieldset>
            <button id="backupBtn" type="button">バックアップを書き出す</button>
            <span id="backupLast" class="backup-last"></span>
            <button id="restoreBtn" type="button">バックアップを読み込む</button>
            <button id="manageAreasBtn" type="button">用途管理</button>
            <button id="manageProjectsBtn" type="button">プロジェクト管理</button>
            <button id="trashBtn" type="button">ゴミ箱</button>
            <button id="signOutBtn" type="button">ログアウト</button>
          </div>
        </details>
      </header>
      <section id="add" class="add" aria-label="タスクを追加"></section>
      <section id="linkAdd" class="add" aria-label="リンクを追加" hidden></section>
      <main id="view" class="view"></main>
    </div>
    <nav id="tabbar" class="tabbar" aria-label="画面の切り替え"></nav>
  </div>
</body>
</html>
